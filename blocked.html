<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Site blocked · Stay Focus</title>
    <link rel="stylesheet" href="src/styles.css">
    <script type="module" src="src/blocked.js"></script>
  </head>
  <body>
    <main class="blocked-shell mdo-panel mdo-card" aria-labelledby="blocked-title">
      <span class="mdo-brand"><span class="mdo-brand__mark" aria-hidden="true">✦</span>Stay Focus</span>
      <p class="mdo-card__eyebrow blocked-eyebrow">Focus window</p>
      <h1 id="blocked-title">This site is blocked.</h1>
      <p class="blocked-site" id="blocked-site"></p>
      <p class="mdo-card__description" id="blocked-description" aria-live="polite">Checking your focus window…</p>
      <div class="blocked-actions">
        <button class="mdo-button mdo-button--primary" id="retry" type="button" disabled>Return to site</button>
        <button class="mdo-button" id="open-options" type="button">Open settings</button>
      </div>
      <p class="error-message" id="error" role="alert" hidden></p>
    </main>
  </body>
</html>
